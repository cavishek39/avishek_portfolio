name: Feature Request
description: Got a cool idea? Suggest it here.
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees:
  - octocat
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this an idea for improving the project!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: textarea
    id: what-your-idea
    attributes:
      label: Tell us about your idea
      description: |
        - Give as much detail as you can to help us understand the change you want to see.
        - Why should the project be changed? What use cases does it support ?
        - What is the expected outcome?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Which platforms are you seeing the problem on?
      multiple: true
      options:
        - Android
        - IOS
    validations:
        required: true
  - type: textarea  
    id: anything-else
    attributes:
      label: Anything else?
      description: Anything else that we should know about your issue?
      placeholder: |
        - eg: UI design or Screen recording of the expected output
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://example.com)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true