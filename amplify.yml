version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yarn config set registry https://registry.npmjs.org
        - yarn install --frozen-lockfile
    build:
      commands:
        - export NODE_OPTIONS=--openssl-legacy-provider
        - yarn build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
